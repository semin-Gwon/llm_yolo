cmd_vel_to_sport_request_node:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    control_request_topic: /api/sport/request
    emergency_stop_topic: /emergency_stop
    emergency_clear_topic: /emergency_clear
    max_linear_x_mps: 0.3
    max_lateral_y_mps: 0.0
    max_yaw_radps: 0.4
    cmd_vel_timeout_sec: 0.35
    watchdog_period_sec: 0.1
    stop_repeat_count: 3
    publish_stop_on_zero_cmd: true
